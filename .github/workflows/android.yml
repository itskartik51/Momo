name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
        cache-disabled: true
        generate-job-summary: false

    - name: Auto-Generate Permanent Release Keystore
      run: |
        if [ ! -f "release.keystore" ]; then
          echo "Generating permanent release keystore..."
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias momo \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MomoReleaseSecret2026 \
            -keypass MomoReleaseSecret2026 \
            -dname "CN=Momo, OU=Personal, O=Personal, L=Todaraisingh, S=Rajasthan, C=IN"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add release.keystore
          git commit -m "Add permanent release keystore [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || true
        else
          echo "Release keystore already present."
        fi

    - name: Build Release APK with R8 Compression
      run: gradle assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Momo-App-Release
        path: app/build/outputs/apk/release/*.apk

    - name: Auto-Sync Version & Deploy Update
      if: contains(github.event.head_commit.message, '[RUN]')
      run: |
        V_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
        V_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)

        mkdir -p Updates

        cat <<EOF > Updates/version.json
        {
          "latest_version_code": $V_CODE,
          "latest_version_name": "v$V_NAME",
          "release_notes": "Momo automated update deployment via GitHub Actions.",
          "apk_url": "https://raw.githubusercontent.com/${{ github.repository }}/main/Updates/Momo_Update.apk"
        }
        EOF

        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        cp $APK_PATH Updates/Momo_Update.apk

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add Updates/version.json Updates/Momo_Update.apk
        git commit -m "Auto-Deploy Update v$V_NAME [skip ci]" || echo "Nothing to commit"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
