name: Android CI Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto-Generate and Commit Permanent Release Keystore
        run: |
          if [ ! -f "release.keystore" ]; then
            echo "Generating permanent release keystore at root..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias momo \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass MomoReleaseSecret2026 \
              -keypass MomoReleaseSecret2026 \
              -dname "CN=Momo, OU=Personal, O=Personal, L=Todaraisingh, S=Rajasthan, C=IN"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add release.keystore
            git commit -m "Add permanent release keystore [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || true
          else
            echo "Release keystore already present."
          fi

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.6
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momo-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
